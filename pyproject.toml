[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E741",  # « l » pour une ligne de journal, lisible ici
  "B905",  # zip(strict=) : les listes de boîtes Ultralytics sont toujours de même longueur
]
